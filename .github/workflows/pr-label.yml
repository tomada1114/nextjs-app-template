name: Label PR

on:
  pull_request:
    types: [opened, reopened, edited, synchronize]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  label:
    name: Label by Conventional Commit type
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # The one job in this repository that writes anything. It writes labels
      # and nothing else. `pull_request` (never `pull_request_target`) is used,
      # so GitHub downgrades this token to read-only for a fork PR regardless
      # of the `write` requested here — see the fallback below — even though
      # the steps below check out and run the fork's own scripts/label-pr.mjs.
      pull-requests: write # to add/remove labels on the pull request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      # The mapping and the stale-label removal both live in scripts/label-pr.mjs
      # (tested by tests/label-pr.test.ts) rather than in this shell step, so
      # `pnpm check:source`'s scripts/** coverage floor covers the logic. This
      # script only ever creates or updates a label the mapping resolves to; the
      # labels themselves are declared in .github/labels.yml and
      # created/updated ahead of time by `pnpm repo:labels`
      # (scripts/sync-labels.mjs), run manually by a maintainer.
      - name: Apply the label matching the PR title type
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # Read through the environment, never interpolated into the script:
          # a PR title is attacker-controlled text.
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/label-pr.mjs
