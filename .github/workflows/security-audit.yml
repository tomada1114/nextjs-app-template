name: Security audit

on:
  pull_request:
  schedule:
    # Weekly. An advisory published after a PR merged is found here, not by the
    # PR-time dependency review.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions: {}

# The runner's default `bash -e` hides a failure inside a pipeline and expands
# an unset variable to the empty string. A security check that fails that way
# reports success, so the retry loop below runs under a shell that fails closed.
defaults:
  run:
    shell: "bash --noprofile --norc -eo pipefail -u {0}"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # PR updates supersede their scan; scheduled and manual audits run to completion.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    name: Audit production dependencies
    # Dependency review covers PR additions; this audit catches later advisories.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Only what consumers install. A dev-only advisory is handled by the
      # Dependabot PR, and must not page whoever reads this schedule. Registry
      # failures are retried briefly and then fail closed: an unavailable audit
      # service must never produce a green security result.
      - name: Audit
        run: |
          for attempt in 1 2 3; do
            pnpm audit --prod --audit-level=moderate && exit 0
            if [ "${attempt}" -lt 3 ]; then
              echo "Audit attempt ${attempt} failed; retrying in 10 seconds."
              sleep 10
            fi
          done
          echo "::error::Production dependency audit failed after 3 attempts."
          exit 1

  secret-scan:
    name: Scan history for leaked credentials
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: "8.30.1"
      # From the release's own gitleaks_8.30.1_checksums.txt.
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Include intermediate commits too: deleting a leaked key in a later
          # commit does not remove it from the PR's history.
          fetch-depth: 0

      # Installed as a checksum-pinned binary rather than through a
      # third-party Action: gitleaks/gitleaks-action wraps this same MIT
      # core in a proprietary EULA, and trufflesecurity/trufflehog's own
      # repository is AGPL-3.0 — both fail this repo's dependency-review
      # `deny-licenses` gate. The gitleaks CLI itself is MIT-licensed and
      # carries no such gate.
      - name: Install gitleaks
        run: |
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | sha256sum --check --strict
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      # Full history also covers commits made through the API or with hooks absent.
      # Redaction keeps any finding out of the public job log.
      - name: Scan git history for secrets
        run: gitleaks detect --source . --no-banner --redact
