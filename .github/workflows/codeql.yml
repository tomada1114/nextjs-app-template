name: CodeQL

on:
  push:
    branches: [main]
  schedule:
    # Weekly, so a query pack released after the last push still reaches code
    # that has not changed since.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  # Keyed by commit and never cancelled: a run on a merged commit is the only
  # analysis that commit gets, and a ref-keyed group would let the next push
  # replace a pending run outright.
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # The only write: uploading the SARIF results to code scanning. The job
      # runs on push, schedule and dispatch only, never on a pull request, so
      # no fork's code ever executes with this token.
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # `build-mode: none` for both: neither language needs a build to be
        # analysed, so nothing from this repository is executed here.
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:${{ matrix.language }}"
