# Single-package repository: no `packages:` globs on purpose.
#
# This file exists so the pnpm supply-chain policy below is declared in one
# machine-readable place, reviewable in a diff, and applied to every install
# (local, CI, and release) without relying on per-developer configuration.

# Reproduce the pnpm version resolved in pnpm-lock.yaml when the local pnpm
# does not satisfy devEngines.packageManager, instead of failing the install.
pmOnFail: download

# Refuse to run a script against a node_modules that no longer matches the
# lockfile, instead of letting a gate pass against stale dependencies.
verifyDepsBeforeRun: error

# Supply-chain cooldown: refuse dependency versions published less than 7 days
# (10080 minutes) ago, so a compromised or broken release has time to be found
# before it can enter this project.
minimumReleaseAge: 10080
# Apply the cooldown to every version, including ones already in the lockfile.
minimumReleaseAgeStrict: true
# Fail closed when registry metadata has no publish time rather than assuming
# the version is old enough.
minimumReleaseAgeIgnoreMissingTime: false

# Reject dependencies whose provenance / trusted-publisher level regressed
# compared to a previously resolved version.
trustPolicy: no-downgrade
# Never trust the trust metadata recorded in a lockfile a contributor produced
# under a weaker policy; re-verify against the registry.
trustLockfile: false
# Refuse transitive dependencies fetched from git or arbitrary tarball URLs.
blockExoticSubdeps: true

# Unmet or conflicting peer ranges are errors, not warnings.
strictPeerDependencies: true
# Fail the install when a dependency wants to run a lifecycle script that is
# not explicitly allowed below.
strictDepBuilds: true

# Install-script allowlist. Every entry is a reviewed exception: adding one is
# a security-sensitive change and needs the same scrutiny as a new dependency.
allowBuilds:
  # lefthook ships a postinstall that downloads/links its Go binary; that is
  # the whole point of depending on it for Git hooks.
  lefthook: true

# Transitive-version overrides. Each entry names the single graph edge it
# replaces (`parent>child`) rather than the package globally, so a future
# dependency that needs a different version of either is not silently pinned
# to this one. None of them relaxes the policy above.
overrides:
  # eslint-config-next depends on ^3.5.2. Its 3.9+ releases resolve through
  # unrs-resolver, a native binary linked by a lifecycle script, which would
  # need an allowBuilds entry above for a resolver no enabled rule ever loads.
  # 3.8.7 is the newest release that still uses the pure-JS enhanced-resolve.
  eslint-config-next>eslint-import-resolver-typescript: 3.8.7
  # semver@6.3.1 carries no provenance while earlier-published semver releases
  # do, so trustPolicy: no-downgrade refuses it. This one is deliberately
  # global rather than one `parent>child` edge: semver@^6 is reached through
  # eslint-plugin-react, eslint-plugin-import and @babel/core (under
  # eslint-plugin-react-hooks) independently, so naming edges would be an
  # incomplete list that a new transitive dependency silently reopens. semver 7
  # answers the same range queries. Drop this once 6.3.1 regains provenance or
  # nothing reaches for semver@6.
  semver: ^7.7.4

# Peer-range exceptions, one graph edge each. strictPeerDependencies above
# stays on: these three plugins arrive only as dependencies of
# eslint-config-next and still cap their declared eslint peer at 9, while this
# repository runs eslint 10. Drop an entry as soon as its plugin publishes a
# release naming eslint 10.
peerDependencyRules:
  allowedVersions:
    eslint-plugin-import>eslint: "10"
    eslint-plugin-jsx-a11y>eslint: "10"
    eslint-plugin-react>eslint: "10"
